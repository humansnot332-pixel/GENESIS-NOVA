<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src https://*.supabase.co; object-src 'none'; base-uri 'none'; form-action 'none'; upgrade-insecure-requests">
<title>Quotation</title>
<style>
@font-face { font-family: "Inter"; font-style: normal; font-display: swap; font-weight: 100 900; src: url(fonts/inter-latin.woff2) format("woff2"); unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }
@font-face { font-family: "Inter"; font-style: normal; font-display: swap; font-weight: 100 900; src: url(fonts/inter-latin-ext.woff2) format("woff2"); unicode-range: U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF; }
  :root { --bg:#f4f6fa; --card:#fff; --ink:#0f172a; --mu:#64748b; --line:#e2e8f0; --acc:#2563eb; --good:#059669; --warn:#d97706; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0b1020; --card:#121a2e; --ink:#e5e9f2; --mu:#94a3b8; --line:#243049; --acc:#60a5fa; --good:#34d399; --warn:#fbbf24; } }
  * { box-sizing:border-box } body { margin:0; background:var(--bg); color:var(--ink); font:14.5px/1.55 Inter, system-ui, sans-serif }
  .wrap { max-width:1200px; margin:0 auto; padding:24px 16px 60px }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:24px; box-shadow:0 1px 2px rgba(0,0,0,.04) }
  .hd { display:flex; justify-content:space-between; gap:16px; flex-wrap:wrap; border-bottom:2px solid var(--acc); padding-bottom:14px; margin-bottom:16px }
  h1 { margin:0; font-size:22px } h2 { margin:0 0 4px; font-size:18px; letter-spacing:.5px; color:var(--acc) }
  .mu { color:var(--mu); font-size:13px } .r { text-align:right }
  .tw { overflow-x:auto; margin:16px 0 } table { width:100%; border-collapse:collapse; min-width:560px }
  th, td { padding:9px 10px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top } th { font-size:12px; text-transform:uppercase; color:var(--mu); letter-spacing:.4px }
  td.r, th.r { text-align:right; white-space:nowrap } .tot td { border:0; padding:4px 10px } .grand td { font-size:18px; font-weight:700; border-top:2px solid var(--line); padding-top:10px }
  .actions { display:flex; gap:10px; flex-wrap:wrap; margin-top:20px } button, .btn { font:inherit; font-weight:600; border-radius:10px; padding:11px 18px; border:1px solid var(--line); background:var(--card); color:var(--ink); cursor:pointer; text-decoration:none }
  button.pri { background:var(--good); border-color:var(--good); color:#fff } button:disabled { opacity:.6; cursor:default }
  textarea { width:100%; min-height:90px; font:inherit; padding:10px; border-radius:10px; border:1px solid var(--line); background:var(--bg); color:var(--ink); margin-top:10px }
  .note { padding:12px 14px; border-radius:10px; margin-top:16px; font-weight:500 } .note.ok { background:color-mix(in srgb, var(--good) 14%, transparent) } .note.w { background:color-mix(in srgb, var(--warn) 16%, transparent) }
  .center { text-align:center; padding:80px 16px } pre { white-space:pre-wrap; font:inherit; margin:0 }
  .blk { margin-top:18px } .blk > b.t { display:block; font-size:12px; text-transform:uppercase; letter-spacing:.4px; color:var(--mu); margin-bottom:6px }
  .rich { font-size:13.5px; line-height:1.55; overflow-wrap:break-word } .rich > :first-child { margin-top:0 } .rich p { margin:0 0 6px } .rich ol, .rich ul { margin:0 0 6px; padding-left:22px } .rich li { margin:2px 0 }
  .rich h3 { font-size:16px; margin:10px 0 6px } .rich h4 { font-size:14px; margin:8px 0 4px } .rich blockquote { margin:0 0 6px 24px }
  .rich table { min-width:0; margin:6px 0 10px } .rich th, .rich td { border:1px solid var(--line); padding:6px 8px; text-transform:none; letter-spacing:0; font-size:inherit; color:inherit }
  .rich th { background:color-mix(in srgb, var(--mu) 10%, transparent); font-weight:600 } .rich hr { border:0; border-top:1px solid var(--line) } .rich a { color:var(--acc) }
  @media (prefers-color-scheme: dark) { .rich { background:#fff; color:#111827; padding:12px 14px; border-radius:10px } .rich th, .rich td { border-color:#c9ced6 } .rich th { background:#f1f3f6 } .rich a { color:#0f766e } }
  .annex { margin-top:16px }
  .terms { display:grid; grid-template-columns:repeat(auto-fill, minmax(190px, 1fr)); gap:8px 16px; margin-top:14px; padding:12px 14px; border:1px solid var(--line); border-radius:12px }
  .terms div { display:flex; flex-direction:column; font-size:13.5px } .terms span { font-size:11.5px; text-transform:uppercase; letter-spacing:.4px }
  pre.dt { font-size:12.5px; margin-top:2px }
  .optbox table th:first-child { width:34px } .optbox input[type=checkbox] { width:18px; height:18px; accent-color:var(--good); cursor:pointer; margin:0 }
  .optbox tr.on td { background:color-mix(in srgb, var(--good) 10%, transparent) }
  .optsum { margin-top:8px; padding:10px 12px; border-radius:10px; background:color-mix(in srgb, var(--good) 13%, transparent); font-weight:600 }
  table { min-width:980px } td.c, th.c { text-align:center } td.nw { white-space:nowrap } pre.pn { font-weight:600 } .pick tr:not(.tot):not(.grand) > td:nth-child(3), .tw:not(.pick) > table tr:not(.tot):not(.grand) > td:nth-child(2) { min-width:220px } .tw th, .tw td { padding:9px 7px } .tw th { font-size:11px } pre.dt { font-style:italic; font-size:13px }
  th { vertical-align:middle } .tot td.nob, .grand td.nob { border:0 } .tot td.lb, .grand td.lb { border-left:1px solid var(--line) } .tot td { border-bottom:1px solid var(--line) }
  .pickhint { margin:14px 0 4px; padding:9px 12px; border-radius:10px; background:color-mix(in srgb, var(--acc) 10%, transparent); font-size:14px }
  .pick th.ck, .pick td.ck { width:36px; text-align:center } .pick input[type=checkbox] { width:20px; height:20px; accent-color:var(--good); cursor:pointer; margin:0 }
  .pick tbody:first-of-type tr { cursor:pointer } .pick tbody:first-of-type tr:not(.on) td:not(.ck) { opacity:.45 } .pick tbody:first-of-type tr:not(.on) td:last-child { text-decoration:line-through }
  .pick tbody:first-of-type tr.on td { background:color-mix(in srgb, var(--good) 7%, transparent) }
  .otag { display:inline-block; font-size:11px; font-weight:600; padding:1px 7px; border-radius:99px; margin-bottom:3px; background:color-mix(in srgb, var(--warn) 22%, transparent) }
  .selsum { margin-top:8px; padding:10px 12px; border-radius:10px; background:color-mix(in srgb, var(--good) 13%, transparent); font-weight:500 } .selsum.bad { background:color-mix(in srgb, #ef4444 15%, transparent) }
  .lnk { background:none; border:0; color:var(--acc); cursor:pointer; font:inherit; text-decoration:underline; padding:0 0 0 8px }
  @media print { body { background:#fff; color:#000 } .actions, #resp { display:none } .card { border:0; box-shadow:none; padding:0 } .annex { break-before:page; margin-top:0 } .rich { background:none; padding:0 } .optbox input, .optbox .hint, .optsum { display:none }
    .pick .ck, .pickhint, .selsum { display:none } .pick tbody:first-of-type tr:not(.on) { display:none } .pick tbody:first-of-type tr.on td { background:none } }
</style>
<style>
  /* PDF made by the CRM from this page: light, flat, the HTML tick boxes hidden (the PDF draws its own), no dimmed rows */
  :root.pdfmode { --bg:#fff; --card:#fff; --ink:#0f172a; --mu:#64748b; --line:#e2e8f0; --acc:#2563eb; --good:#059669; --warn:#d97706; }
  .pdfmode body { background:#fff } .pdfmode .wrap { max-width:none; margin:0; padding:0 }
  .pdfmode .card { border:0; box-shadow:none; border-radius:0; padding:20px 24px } .pdfmode .tw { overflow:visible }
  .pdfmode .rich { background:none; color:inherit; padding:0 } .pdfmode .pick input[type=checkbox] { visibility:hidden }
  .pdfmode .pick tbody:first-of-type tr td, .pdfmode .pick tbody:first-of-type tr:not(.on) td { background:none; opacity:1; text-decoration:none }
  .pdfmode .annex { margin-top:0 } .pdfmode #selSum { display:none }
  .pdfmode table { min-width:0 } .pdfmode th, .pdfmode td { padding:8px 7px } .pdfmode td.nw { white-space:normal }
  .pdfmode .pick tr:not(.tot):not(.grand) > td:nth-child(3) { min-width:200px }
  /* the PDF drawer (html2canvas) cannot read color-mix() → plain colours that look the same on white */
  .pdfmode .note.ok, .pdfmode .optsum, .pdfmode .selsum { background:#dcf1ea } .pdfmode .note.w { background:#fbeedb } .pdfmode .selsum.bad { background:#fde2e2 }
  .pdfmode .rich th { background:#f1f3f6 } .pdfmode .optbox tr.on td { background:#e6f4ef } .pdfmode .pickhint { background:#e9effd } .pdfmode .otag { background:#f9e7cb }
</style>
<script type="module" src="quote.js"></script>
<style>
  /* ERP "Proposal" layout (PDF + print) */
  .prop { font-size:12.5px; color:#111 !important; padding:18px 20px !important }
  .prop .bar { background:#3a78b5; color:#fff; font-weight:700; padding:6px 12px; font-size:14px; display:grid; grid-template-columns:2.2fr 1fr; margin-top:12px }
  .prop .bar.title { display:block; text-align:center; font-size:15px; margin-top:0 }
  .prop .bar > span:last-child { text-align:right }
  .prop .bar:not(:has(span)) { display:block }
  .prop .box { border:1px solid #3a78b5; border-top:0; padding:10px 12px }
  .prop .grid3 { display:grid; grid-template-columns:1.15fr 1.15fr 1fr; gap:16px }
  .prop .dgrid { gap:8px }
  .prop .from { display:flex; gap:10px } .prop .from img { width:92px; height:92px; object-fit:contain; display:block; margin-top:4px }
  .prop .lbl { display:block; font-weight:700; font-size:14px; margin-bottom:4px } .prop .co { font-size:15.5px; margin-bottom:2px }
  .prop table { width:100%; min-width:0 !important; border-collapse:collapse }
  .prop table.kv td { border:1px solid #c5c9cf; padding:4px 6px; font-size:12px; text-transform:none; letter-spacing:0; color:#111; vertical-align:top }
  .prop table.kv td:first-child { font-weight:700; width:46% }
  .prop .th { font-weight:700; border:1px solid #c5c9cf; border-bottom:0; padding:4px 6px; font-size:12px }
  .prop table.items { margin-top:12px } .prop table.items th { background:#fff; color:#111; font-size:12px; text-transform:none; letter-spacing:0; font-weight:700; border:1px solid #9aa1aa; padding:6px 5px; text-align:center; vertical-align:middle }
  .prop table.items td { border:1px solid #9aa1aa; padding:6px 5px; font-size:12px; vertical-align:top }
  .prop table.items td.r, .prop table.items th.r { text-align:right } .prop table.items td.ck, .prop table.items th.ck { width:30px; text-align:center }
  .prop table.items input[type=checkbox] { visibility:hidden; width:16px; height:16px; margin:0 }
  .prop table.items tr > td:nth-child(3) { min-width:230px }
  .prop pre.pn { font-weight:700; text-transform:uppercase; margin:0 } .prop pre.dt { margin:6px 0 0; color:#222 }
  .prop .otag { display:inline-block; margin-top:4px; font-size:11px; background:#f9e7cb; color:#7a4a00; padding:1px 6px; border-radius:4px }
  .prop .pbox { font-size:16px; line-height:1 }
  .prop .sum { display:flex; justify-content:space-between; align-items:flex-end; gap:18px; margin:12px 0 4px }
  .prop .words { font-size:12px; flex:1 } .prop .wv { display:inline-block; min-width:430px }
  .prop table.tots { width:310px; flex:none } .prop table.tots td { border:1px solid #9aa1aa; padding:5px 7px; font-size:12.5px; text-align:right } .prop table.tots tr.grand td { font-size:13.5px }
  .prop .tc { display:grid; grid-template-columns:1fr 260px; gap:16px; align-items:start } .prop .tc .rich { font-size:12px }
  .prop .sign { text-align:center; display:flex; flex-direction:column; align-items:center; gap:6px } .prop .sign img { width:120px; height:120px; object-fit:contain }
  .prop .foot { text-align:center; font-weight:700; font-size:11.5px; margin-top:14px }
  .prop .pickhint { margin:12px 0 0 } .prop pre { white-space:pre-wrap; font-family:inherit; margin:0 }
  .printmode .prop { padding:0 !important } @media print { .prop .bar, .prop .otag { -webkit-print-color-adjust:exact; print-color-adjust:exact } .printmode .annex { break-before:page } }
</style>
</head>
